<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Core Lightning / Arrow Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent Emerald Pulse -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.85"/>

  <!-- Subtle Inner Grid / Orbit Lines -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="128" cy="128" r="62" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- Network Gateway Nodes & Connection Lines -->
  <g opacity="0.5">
    <line x1="56" y1="128" x2="128" y2="48" stroke="#38bdf8" stroke-width="2"/>
    <line x1="200" y1="128" x2="128" y2="48" stroke="#6366f1" stroke-width="2"/>
    <line x1="56" y1="128" x2="128" y2="208" stroke="#38bdf8" stroke-width="2"/>
    <line x1="200" y1="128" x2="128" y2="208" stroke="#818cf8" stroke-width="2"/>
    <circle cx="56" cy="128" r="4" fill="#38bdf8"/>
    <circle cx="200" cy="128" r="4" fill="#818cf8"/>
    <circle cx="128" cy="48" r="4" fill="#38bdf8"/>
    <circle cx="128" cy="208" r="4" fill="#818cf8"/>
  </g>

  <!-- Cyber Shield Body -->
  <path d="M128 42 L196 68 C196 122 170 174 128 198 C86 174 60 122 60 68 Z"
        fill="url(#shieldGrad)" stroke="url(#borderGrad)" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner Dynamic Lightning / Gateway Bolt -->
  <path d="M136 64 L96 126 L124 126 L116 176 L160 114 L132 114 Z"
        fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Pulse Status Core Dot -->
  <circle cx="168" cy="80" r="10" fill="url(#pulseGrad)" stroke="#0f172a" stroke-width="3"/>
  <circle cx="168" cy="80" r="4" fill="#ffffff"/>
</svg>
