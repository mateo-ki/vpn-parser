name: Windows

# 打 tag（v1.0.0 这种）就在 GitHub Actions 的 Windows runner 上：
# 跑全部测试 → cargo build --release → Inno Setup 编安装包 + 便携版 zip → 算 SHA-256 → 发 GitHub Release。
# 手动跑（workflow_dispatch）只产出"工作流产物"，不会发布 Release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C linker=rust-lld"

jobs:
  installer:
    name: 打包 Windows 安装包与便携版并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号的唯一真源是 Cargo.toml，tag 只是它的镜像：安装包文件名、"关于"里的版本、
      # 卸载列表都从 Cargo.toml 来，而「检查更新」是按 tag 去拼资产名找文件的。
      # 两边写岔时包照样能编出来，但发出去的 Release 会找不到自己的安装包 —— 所以在这里
      # 就掐死，别等到花二十分钟编完才发现。
      - name: 核对 tag 与 Cargo.toml 的版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $declared = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          $fromTag = $env:TAG -replace '^v', ''
          if ($fromTag -ne $declared) {
            throw "tag $env:TAG says $fromTag but Cargo.toml says $declared - they must match"
          }
          Write-Host "version matches tag: $declared"

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译 release 版 (LLVM lld 高速并行链接)
        run: cargo build --release --bin vpn-parser

      - name: 编译安装包
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/vpn-parser.iss'

      - name: 打包 Windows 便携版 (zip)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          $zipName = "vpn-parser-$version-windows-x64-portable.zip"
          $zipPath = "dist/$zipName"
          if (!(Test-Path "dist")) {
            New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          }
          # 创建临时便携版目录，放入可执行文件与说明文件
          $stageDir = "dist/vpn-parser-$version-windows-x64"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item "target/release/vpn-parser.exe" "$stageDir/"
          if (Test-Path "README.md") { Copy-Item "README.md" "$stageDir/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$stageDir/" }
          Compress-Archive -Path "$stageDir/*" -DestinationPath $zipPath -Force
          Remove-Item -Recurse -Force $stageDir
          Write-Host "Portable package created at $zipPath"

      - name: 算 SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist | Where-Object { $_.Name -match '\.(exe|zip)$' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/sha256.txt
          Get-Content dist/sha256.txt

      - name: 上传为工作流产物（任何一次运行都留一份）
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/sha256.txt
          if-no-files-found: error

      # 只有 push tag 才真的发 Release。
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem dist | Where-Object { $_.Name -match '\.(exe|zip|txt)$' } | Select-Object -ExpandProperty FullName
          # tag 里带 -alpha./-beta./-rc./-dev./-preview. 就发成预发布版：GitHub 的 /releases/latest 会跳过
          # prerelease，稳定通道的用户收不到它，只有「关于」里勾了「参与预发」或主动切换版本的人才拿得到。
          $pre = $env:TAG -match '-(alpha|beta|rc|dev|preview)(\.|\b)' -or $env:TAG -match '-[0-9A-Za-z]+'
          $versionClean = $env:TAG.TrimStart('v')
          $notesValid = (Test-Path "RELEASE_NOTES.md") -and ((Get-Content "RELEASE_NOTES.md" -Raw) -match [regex]::Escape($versionClean))
          if (gh release view "$env:TAG" 2>$null) {
            Write-Host "Release $env:TAG already exists, updating assets with --clobber..."
            gh release upload "$env:TAG" @assets --clobber
            if ($notesValid) {
              gh release edit "$env:TAG" --notes-file RELEASE_NOTES.md
            }
            if ($pre) { gh release edit "$env:TAG" --prerelease } else { gh release edit "$env:TAG" --prerelease=false }
          } elseif ($pre) {
            if ($notesValid) {
              gh release create "$env:TAG" @assets --title "VPN Parser $env:TAG（预发）" --notes-file RELEASE_NOTES.md --prerelease
            } else {
              gh release create "$env:TAG" @assets --title "VPN Parser $env:TAG（预发）" --generate-notes --prerelease
            }
          } else {
            if ($notesValid) {
              gh release create "$env:TAG" @assets --title "VPN Parser $env:TAG" --notes-file RELEASE_NOTES.md
            } else {
              gh release create "$env:TAG" @assets --title "VPN Parser $env:TAG" --generate-notes
            }
          }
