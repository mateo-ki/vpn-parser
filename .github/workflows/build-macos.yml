name: macOS

# macOS 持续集成与发布流水线：
# 1) 跑全量测试 (macos-latest runner)；
# 2) 打 tag 或手动触发时编译 release 二进制并打包为 darwin tar.gz 归档；
# 3) 计算 SHA-256 并自动并入 GitHub Release。

on:
  push:
    branches: [main, dev]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试 (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 跑全量测试
        run: cargo test --bin vpn-parser

  package:
    name: 打包 macOS 发行版
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag 与 Cargo.toml 的版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          from_tag=${GITHUB_REF_NAME#v}
          if [ "$from_tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $from_tag but Cargo.toml says $declared" >&2
            exit 1
          fi
          echo "version matches tag: $declared"

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 编译 release 版 (Universal / Native)
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin || true
          cargo build --release --bin vpn-parser
          mac_arch=$(uname -m)
          if cargo build --release --target x86_64-apple-darwin --bin vpn-parser; then
            if lipo -create -output target/release/vpn-parser-universal target/release/vpn-parser target/x86_64-apple-darwin/release/vpn-parser; then
              mv target/release/vpn-parser-universal target/release/vpn-parser
              mac_arch="universal"
              echo "成功打包 Universal 二进制 (arm64 + x86_64)"
            fi
          fi
          echo "mac_arch=${mac_arch}" >> "$GITHUB_ENV"

      - name: 创建 macOS 应用包 (.app)、DMG 安装包 (.dmg) 与归档 (.tar.gz)
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          arch="${mac_arch:-$(uname -m)}"
          mkdir -p dist

          # 1. 创建 .app 目录结构
          APP_NAME="VPN Parser"
          APP_DIR="${APP_NAME}.app"
          rm -rf "${APP_DIR}"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          # 2. 拷贝二进制
          cp target/release/vpn-parser "${APP_DIR}/Contents/MacOS/vpn-parser"
          chmod +x "${APP_DIR}/Contents/MacOS/vpn-parser"

          # 3. 写入 Info.plist
          sed "s/__VERSION__/${version}/g" installer/Info.plist > "${APP_DIR}/Contents/Info.plist"

          # 4. 生成 AppIcon.icns
          if [ -f assets/app-icon.png ]; then
            ICONSET="AppIcon.iconset"
            rm -rf "${ICONSET}"
            mkdir -p "${ICONSET}"
            sips -z 16 16     assets/app-icon.png --out "${ICONSET}/icon_16x16.png" >/dev/null 2>&1 || true
            sips -z 32 32     assets/app-icon.png --out "${ICONSET}/icon_16x16@2x.png" >/dev/null 2>&1 || true
            sips -z 32 32     assets/app-icon.png --out "${ICONSET}/icon_32x32.png" >/dev/null 2>&1 || true
            sips -z 64 64     assets/app-icon.png --out "${ICONSET}/icon_32x32@2x.png" >/dev/null 2>&1 || true
            sips -z 128 128   assets/app-icon.png --out "${ICONSET}/icon_128x128.png" >/dev/null 2>&1 || true
            sips -z 256 256   assets/app-icon.png --out "${ICONSET}/icon_128x128@2x.png" >/dev/null 2>&1 || true
            sips -z 256 256   assets/app-icon.png --out "${ICONSET}/icon_256x256.png" >/dev/null 2>&1 || true
            iconutil -c icns "${ICONSET}" -o "${APP_DIR}/Contents/Resources/AppIcon.icns" || true
            rm -rf "${ICONSET}"
          fi

          # 5. 生成 DMG 安装包
          DMG_STAGING="dmg_staging"
          rm -rf "${DMG_STAGING}"
          mkdir -p "${DMG_STAGING}"
          cp -R "${APP_DIR}" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"
          dmg_name="vpn-parser-${version}-darwin-${arch}.dmg"
          hdiutil create -volname "VPN Parser" -srcfolder "${DMG_STAGING}" -ov -format UDZO "dist/${dmg_name}"
          rm -rf "${DMG_STAGING}"

          # 6. 生成命令行打包 (.tar.gz)
          tar_name="vpn-parser-${version}-darwin-${arch}.tar.gz"
          tar -czf "dist/${tar_name}" -C target/release vpn-parser

          # 7. 计算哈希值
          cd dist
          shasum -a 256 "${dmg_name}" > "${dmg_name}.sha256"
          shasum -a 256 "${tar_name}" > "${tar_name}.sha256"
          cat *.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/*
          if-no-files-found: error

      - name: 上传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          for i in $(seq 1 40); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag 已存在（第 $i 次查到），上传 macOS 资产"
              for f in dist/*.tar.gz dist/*.dmg dist/*.sha256; do
                [ -f "$f" ] || continue
                echo "Uploading $f to release $tag..."
                gh release upload "$tag" "$f" --clobber
              done
              exit 0
            fi
            echo "Waiting for release $tag to be created... ($i/40)"
            sleep 15
          done
          echo "Release 等待超时，尝试直接创建并上传资产..."
          gh release create "$tag" dist/* --title "VPN Parser $tag" || true
