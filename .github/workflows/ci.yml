name: CI

# 每次推 master / 开 PR 都跑：快速跑全部单元测试。
# 打包发布走 release.yml（打 tag 才触发）。

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C linker=rust-lld"

jobs:
  build-and-test:
    name: 快速测试 (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 跑全量测试 (Debug 极速构建 + lld 并行链接)
        run: cargo test --bin vpn-parser
