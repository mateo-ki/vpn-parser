name: Linux

# Windows 那条路已经有 ci.yml + release.yml 了。这个作业补另外两件事：
#   1) 在干净环境里跑全量测试 —— 他那台机器的环回会被间歇拦掉（collector 那批用例因此
#      在本地时红时绿），本地红了分不清是回归还是环境；ubuntu runner 上没有这个变量。
#   2) 打 tag 时造出 Linux 的两个包（deb / rpm），并进同一个 GitHub Release。
# 造包全程不需要 root：cargo-deb / cargo-generate-rpm 都是纯 Rust 工具。

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试 (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 跑全量测试
        run: cargo test --bin vpn-parser

  package:
    name: 打包 deb + rpm (linux-x64)
    # 只有 tag / 手动才造包：PR 上不必花 release 构建那几分钟。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag 与 Cargo.toml 的版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          from_tag=${GITHUB_REF_NAME#v}
          if [ "$from_tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $from_tag but Cargo.toml says $declared" >&2
            exit 1
          fi
          echo "version matches tag: $declared"

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 装打包工具
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: 编译 release 版
        run: cargo build --release --bin vpn-parser

      - name: 造 deb
        run: cargo deb

      - name: 造 rpm
        run: cargo generate-rpm

      - name: 造 AppImage
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)

          TOOL_DIR="$HOME/.cache/appimagetool"
          mkdir -p "$TOOL_DIR"
          curl -fSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o "$TOOL_DIR/appimagetool.AppImage"
          chmod +x "$TOOL_DIR/appimagetool.AppImage"
          (cd "$TOOL_DIR" && ./appimagetool.AppImage --appimage-extract && rm -f ./appimagetool.AppImage)

          RUNTIME_FILE="$TOOL_DIR/runtime-x86_64"
          curl -fSL "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" -o "$RUNTIME_FILE"
          chmod +x "$RUNTIME_FILE"

          APPDIR="target/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/16x16/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/32x32/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/48x48/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$APPDIR/usr/share/doc/vpn-parser"

          cp target/release/vpn-parser "$APPDIR/usr/bin/vpn-parser"
          cp packaging/linux/vpn-parser.desktop "$APPDIR/usr/share/applications/vpn-parser.desktop"
          cp packaging/linux/vpn-parser.desktop "$APPDIR/vpn-parser.desktop"
          cp assets/app-icon-16.png "$APPDIR/usr/share/icons/hicolor/16x16/apps/vpn-parser.png"
          cp assets/app-icon-32.png "$APPDIR/usr/share/icons/hicolor/32x32/apps/vpn-parser.png"
          cp assets/app-icon-48.png "$APPDIR/usr/share/icons/hicolor/48x48/apps/vpn-parser.png"
          cp assets/app-icon-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/vpn-parser.png"
          cp assets/app-icon-256.png "$APPDIR/vpn-parser.png"
          (cd "$APPDIR" && ln -sf vpn-parser.png .DirIcon)
          cp LICENSE "$APPDIR/usr/share/doc/vpn-parser/" || true
          cp README.md "$APPDIR/usr/share/doc/vpn-parser/" || true

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          set -e
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "${HERE}/usr/bin/vpn-parser" "$@"
          EOF
          chmod 755 "$APPDIR/AppRun"

          mkdir -p target/appimage
          ARCH=x86_64 "$TOOL_DIR/squashfs-root/AppRun" --no-appstream --runtime-file "$RUNTIME_FILE" "$APPDIR" "target/appimage/vpn-parser-${VERSION}-x86_64.AppImage"
          chmod +x target/appimage/*.AppImage
          ls -lh target/appimage/*.AppImage

      - name: 验包内容（装进去会落哪些路径，先看清单）
        run: |
          set -euo pipefail
          deb=$(ls target/debian/*.deb | head -1)
          rpm=$(ls target/generate-rpm/*.rpm | head -1)
          appimage=$(ls target/appimage/*.AppImage | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          echo "--- rpm ---"
          ls -l "$rpm"
          if ! command -v rpm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rpm
          fi
          rpm -qp --queryformat '%{NAME}-%{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm"
          rpm -qp --list "$rpm"
          # FILEMODES:octal 打出来是**带文件类型位的完整模式**（`100755`），不是 `0755`：
          # 第一次我按 `^0755 ` 去 grep，包是对的、断言是错的。所以这里只取**低 9 位**比对，
          # 并把实际值原样打出来 —— 断言写错和包装错在日志里得一眼能分开。
          rpm -qp --queryformat '[%{FILEMODES:octal} %{FILENAMES}\n]' "$rpm" > /tmp/rpm-modes.txt
          cat /tmp/rpm-modes.txt
          rpm_mode() { awk -v f="$1" '$2==f{print substr($1, length($1)-2); exit}' /tmp/rpm-modes.txt; }
          bin_mode=$(rpm_mode /usr/bin/vpn-parser)
          desktop_mode=$(rpm_mode /usr/share/applications/vpn-parser.desktop)
          echo "实际低 9 位：/usr/bin/vpn-parser=${bin_mode:-缺失} /usr/share/applications/vpn-parser.desktop=${desktop_mode:-缺失}"
          [ "${bin_mode:-0}" = "755" ] || { echo "期望 /usr/bin/vpn-parser 是 755，实得 ${bin_mode:-（清单里没有这个路径）}"; exit 1; }
          [ "${desktop_mode:-0}" = "644" ] || { echo "期望 desktop 入口是 644，实得 ${desktop_mode:-（清单里没有这个路径）}"; exit 1; }
          echo "--- appimage ---"
          ls -lh "$appimage"
          file "$appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/appimage/*.AppImage

      # Release 本体是 release.yml（Windows）建的那个。这里只把三个 Linux 包**追加**进去，
      # 所以要先等它出现 —— 两条作业并行，抢跑会 404。等不到就明确失败，
      # 绝不静默跳过（"资产少了两个"这种事最难从现象倒推）。
      - name: 把三个 Linux 包挂到同一个 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          for i in $(seq 1 40); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag 已存在（第 $i 次查到），上传 Linux 资产"
              gh release upload "$tag" target/debian/*.deb target/generate-rpm/*.rpm target/appimage/*.AppImage --clobber
              exit 0
            fi
            sleep 15
          done
          echo "等 Release $tag 出现超时（10 分钟）—— 检查 release.yml 那次运行" >&2
          exit 1
