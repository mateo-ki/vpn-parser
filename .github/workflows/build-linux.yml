name: Linux

# Windows 那条路已经有 ci.yml + release.yml 了。这个作业补另外两件事：
#   1) 在干净环境里跑全量测试 —— 他那台机器的环回会被间歇拦掉（collector 那批用例因此
#      在本地时红时绿），本地红了分不清是回归还是环境；ubuntu runner 上没有这个变量。
#   2) 打 tag 时造出 Linux 的两个包（deb / rpm），并进同一个 GitHub Release。
# 造包全程不需要 root：cargo-deb / cargo-generate-rpm 都是纯 Rust 工具。

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试 (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 跑全量测试
        run: cargo test --bin vpn-parser

  package:
    name: 打包 deb + rpm (linux-x64)
    # 只有 tag / 手动才造包：PR 上不必花 release 构建那几分钟。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 核对 tag 与 Cargo.toml 的版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          from_tag=${GITHUB_REF_NAME#v}
          if [ "$from_tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $from_tag but Cargo.toml says $declared" >&2
            exit 1
          fi
          echo "version matches tag: $declared"

      - name: 装 stable 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 依赖和 target
        uses: Swatinem/rust-cache@v2

      - name: 装打包工具
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: 编译 release 版
        run: cargo build --release --bin vpn-parser

      - name: 造 deb
        run: cargo deb

      - name: 造 rpm
        run: cargo generate-rpm

      - name: 验包内容（装进去会落哪些路径，先看清单）
        run: |
          set -euo pipefail
          deb=$(ls target/debian/*.deb | head -1)
          rpm=$(ls target/generate-rpm/*.rpm | head -1)
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          echo "--- rpm ---"
          ls -l "$rpm"
          # 这台的 WSL 里没有 rpm 也没有 zstd（payload 是 zstd 压缩的 cpio），
          # 两个都要 sudo 装，所以清单只能在 runner 上真验。
          # 装不上就明确失败：只看文件大小不算"内容正确"。
          if ! command -v rpm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rpm
          fi
          rpm -qp --queryformat '%{NAME}-%{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm"
          rpm -qp --list "$rpm"
          rpm -qp --queryformat '[%{FILEMODES:octal} %{FILENAMES}\n]' "$rpm" | grep -E '^0755 /usr/bin/vpn-parser$'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

      # Release 本体是 release.yml（Windows）建的那个。这里只把两个包**追加**进去，
      # 所以要先等它出现 —— 两条作业并行，抢跑会 404。等不到就明确失败，
      # 绝不静默跳过（"资产少了两个"这种事最难从现象倒推）。
      - name: 把两个包挂到同一个 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          for i in $(seq 1 40); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag 已存在（第 $i 次查到），上传 Linux 资产"
              gh release upload "$tag" target/debian/*.deb target/generate-rpm/*.rpm --clobber
              exit 0
            fi
            sleep 15
          done
          echo "等 Release $tag 出现超时（10 分钟）—— 检查 release.yml 那次运行" >&2
          exit 1
