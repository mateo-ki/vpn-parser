[package]
name = "vpn-parser"
version = "1.2.0"
edition = "2021"
description = "VPN/proxy subscription collector with desktop GUI and HTTP API"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wgpu"], optional = true }
egui = { version = "0.31", optional = true }
# eframe 只给 wgpu 开了 metal/webgpu/wgsl —— Windows 上等于只有 Vulkan 一条腿，
# 没有 OpenGL 又没有 Vulkan 的机器（虚拟机）仍然起不来。这里靠 feature 合并把 dx12
# 补上：D3D12 在 Windows 上连虚拟机都有 WARP 软件实现。
wgpu = { version = "24", default-features = false, features = ["dx12"], optional = true }
once_cell = "1.21"
percent-encoding = "2.3"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
arboard = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:arboard", "dep:image", "dep:wgpu"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Networking_WinInet", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com"] }

[build-dependencies]
embed-resource = "3.0"

[profile.dev]
incremental = true
debug = 1
codegen-units = 16
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
incremental = true
